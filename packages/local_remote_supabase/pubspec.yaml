name: local_remote_supabase
description: >-
  Supabase implementation of RemoteSyncAdapter for the
  local_remote_synchronization ecosystem. Synchronises local mutations to a
  Supabase backend via the Supabase Dart client.
publish_to: none
version: 0.1.0
homepage: https://github.com/youssef-ibrahim23/local-remote-synchronization
repository: https://github.com/youssef-ibrahim23/local-remote-synchronization
issue_tracker: https://github.com/youssef-ibrahim23/local-remote-synchronization/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  local_remote_synchronization:
    path: ../local_remote_synchronization
  supabase_flutter: ^2.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

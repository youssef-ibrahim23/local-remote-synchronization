name: local_remote_hive
description: >-
  Hive implementation of LocalStorageAdapter for the
  local_remote_synchronization ecosystem. Provides lightweight, key-value
  offline-first persistence using Hive on all Flutter platforms.
version: 0.1.0
homepage: https://github.com/youssef-ibrahim23/local-remote-synchronization
repository: https://github.com/youssef-ibrahim23/local-remote-synchronization
issue_tracker: https://github.com/youssef-ibrahim23/local-remote-synchronization/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  local_remote_synchronization:
    path: ../local_remote_synchronization
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_test: ^1.0.1
  mocktail: ^1.0.4

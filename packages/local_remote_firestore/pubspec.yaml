name: local_remote_firestore
description: >-
  Cloud Firestore implementation of RemoteSyncAdapter for the
  local_remote_synchronization ecosystem. Synchronises local mutations to a
  Firebase Firestore backend.
version: 0.1.0
homepage: https://github.com/your-org/local-remote-synchronization
repository: https://github.com/your-org/local-remote-synchronization
issue_tracker: https://github.com/your-org/local-remote-synchronization/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  local_remote_synchronization:
    path: ../local_remote_synchronization
  cloud_firestore: ^5.6.6
  firebase_core: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0

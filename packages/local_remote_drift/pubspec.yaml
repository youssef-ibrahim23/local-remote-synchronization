name: local_remote_drift
description: >-
  Drift implementation of LocalStorageAdapter for the
  local_remote_synchronization ecosystem. Persists the durable outbox inside
  the application's existing Drift database.
version: 0.1.0
publish_to: none
homepage: https://github.com/youssef-ibrahim23/local-remote-synchronization
repository: https://github.com/youssef-ibrahim23/local-remote-synchronization
issue_tracker: https://github.com/youssef-ibrahim23/local-remote-synchronization/issues

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  drift: ^2.21.0
  local_remote_synchronization:
    path: ../local_remote_synchronization
  uuid: ^4.5.1

dev_dependencies:
  async: ^2.11.0
  lints: ^5.0.0
  sqlite3: ^2.4.0
  test: ^1.25.0

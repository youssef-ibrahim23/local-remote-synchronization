name: local_remote_sqflite
description: >-
  sqflite implementation of LocalStorageAdapter for the
  local_remote_synchronization ecosystem. Provides offline-first local
  persistence backed by sqflite on Android and iOS.
version: 0.1.0
publish_to: none
homepage: https://github.com/youssef-ibrahim23/local-remote-synchronization
repository: https://github.com/youssef-ibrahim23/local-remote-synchronization
issue_tracker: https://github.com/youssef-ibrahim23/local-remote-synchronization/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  local_remote_synchronization:
    path: ../local_remote_synchronization
  sqflite: ^2.4.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4

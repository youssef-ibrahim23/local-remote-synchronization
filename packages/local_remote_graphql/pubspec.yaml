name: local_remote_graphql
description: >-
  GraphQL implementation of RemoteSyncAdapter for the
  local_remote_synchronization ecosystem. Synchronises local mutations to any
  GraphQL backend.
version: 0.1.0
homepage: https://github.com/youssef-ibrahim23/local-remote-synchronization
repository: https://github.com/youssef-ibrahim23/local-remote-synchronization
issue_tracker: https://github.com/youssef-ibrahim23/local-remote-synchronization/issues
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  local_remote_synchronization:
    path: ../local_remote_synchronization
  graphql: ^5.2.4
  gql: ^1.0.1
  http: ^1.5.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

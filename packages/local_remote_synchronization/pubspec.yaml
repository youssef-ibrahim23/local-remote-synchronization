name: local_remote_synchronization
description: >-
  Database-agnostic and backend-agnostic Offline-First synchronization core
  for Flutter. Provides contracts, models, and engine abstractions that adapter
  packages implement.
version: 0.1.0
homepage: https://github.com/your-org/local-remote-synchronization
repository: https://github.com/your-org/local-remote-synchronization
issue_tracker: https://github.com/your-org/local-remote-synchronization/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  collection: ^1.19.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0
  mocktail: ^1.0.4

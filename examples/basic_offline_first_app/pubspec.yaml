name: basic_offline_first_app
description: >-
  Reference Flutter application demonstrating Offline-First architecture using
  the local_remote_synchronization ecosystem.
version: 0.1.0

publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  local_remote_synchronization:
    path: ../../packages/local_remote_synchronization
  local_remote_sqflite:
    path: ../../packages/local_remote_sqflite
  local_remote_rest:
    path: ../../packages/local_remote_rest
  connectivity_plus: ^6.1.4
  sqflite: ^2.4.2
  uuid: ^4.5.1
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
